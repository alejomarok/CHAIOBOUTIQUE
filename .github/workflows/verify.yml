name: Verify release
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chaioboutique_test
          POSTGRES_PASSWORD: chaioboutique_test
          POSTGRES_DB: chaioboutique_test
        ports: ["56032:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      CI: "true"
      DATABASE_URL: postgresql://chaioboutique_test:chaioboutique_test@localhost:56032/chaioboutique_test
      DIRECT_URL: postgresql://chaioboutique_test:chaioboutique_test@localhost:56032/chaioboutique_test
      TEST_DATABASE_URL: postgresql://chaioboutique_test:chaioboutique_test@localhost:56032/chaioboutique_test
      BETTER_AUTH_SECRET: ci-only-test-secret-with-more-than-32-characters
      DATA_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      STORE_NAME: CHAIOBOUTIQUE
      STORE_CURRENCY: ARS
      STORE_LOCALE: es-AR
      STORE_TIMEZONE: America/Argentina/Cordoba
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@test.chaioboutique.local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:test:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit -- --maxWorkers=2
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
